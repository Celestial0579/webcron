name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
  # Woechentlicher Neubau ohne Cache: curl und die uebrigen Alpine-Pakete im
  # Abbild bleiben so aktuell, auch wenn sich am Repo nichts aendert (#27).
  schedule:
    - cron: "23 4 * * 1"

# Nur die Veroeffentlichung braucht mehr; sie bekommt es im Auftrag image.
permissions:
  contents: read

jobs:
  lint:
    name: Shellcheck
    # shellcheck ist auf GitHubs ubuntu-latest vorinstalliert.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck bin/webcron bin/webcron-abruf www/cgi-bin/status tests/integrationstest.sh tests/cronfelder.sh

  integration:
    name: Integrationstest
    # GitHubs eigene Laeufer bringen Docker samt Compose mit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/integrationstest.sh

  image:
    name: Abbild bauen, auf main veroeffentlichen
    runs-on: ubuntu-latest
    needs: [lint, integration]
    permissions:
      contents: read
      packages: write
    env:
      # Pull Requests bauen das Abbild nur (prueft das Dockerfile), sie
      # schieben nichts in die Registry. Veroeffentlicht wird allein aus
      # main (Push oder von Hand ueber workflow_dispatch: :latest und :<sha>)
      # und aus Release-Tags vX.Y.Z (zusaetzlich :X.Y.Z).
      VEROEFFENTLICHEN: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.VEROEFFENTLICHEN == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Der Kontoname wird bei GitHub so geschrieben, wie er angelegt wurde;
      # ein Abbildname muss dagegen durchgehend klein sein.
      - name: Kontonamen kleinschreiben
        id: konto
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Abbild-Tags festlegen
        id: tags
        env:
          NAME: ${{ steps.konto.outputs.name }}
        run: |
          {
            echo 'liste<<TAGS'
            echo "ghcr.io/${NAME}/webcron:${GITHUB_SHA}"
            if [ "${GITHUB_REF_TYPE}" = tag ]; then
              echo "ghcr.io/${NAME}/webcron:${GITHUB_REF_NAME#v}"
            else
              echo "ghcr.io/${NAME}/webcron:latest"
            fi
            echo TAGS
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.VEROEFFENTLICHEN == 'true' }}
          tags: ${{ steps.tags.outputs.liste }}
          # Beim woechentlichen Neubau ohne Zwischenstaende, sonst kaeme die
          # alte Paketschicht aus dem Cache.
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
