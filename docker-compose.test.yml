# Testaufbau fuer tests/integrationstest.sh — nichts hiervon ist fuer den
# Betrieb gedacht. "ziel" ist ein Wegwerf-Webserver (tests/ziel.py):
# /takt und /einmal antworten 200, /kopf nur mit richtigem X-Cron-Secret,
# alles andere 404.
#
# Die Testdaten kommen ueber das Volume "testdaten" herein, nicht per
# Bind-Mount -- die Begruendung steht in tests/Dockerfile.
services:
  # Einmal-Dienst: fuellt das Volume und beendet sich. Die beiden anderen
  # Dienste warten darauf, sonst laufen sie gegen ein leeres /tests.
  testdaten:
    build: ./tests
    # Wie im Betrieb: Konfigurationsdateien nur fuer root lesbar (0600 in
    # einem 0700-Verzeichnis). Der Test prueft, dass nobody sie nicht liest.
    command: ["sh", "-c", "cp -a /vorlage/. /tests/ && chmod 600 /tests/*.cron && chmod 700 /tests"]
    volumes:
      - testdaten:/tests

  webcron:
    build: .
    environment:
      # Ersetzt die fruehere Einhaengung von takt.cron nach
      # /config/jobs.cron. Der Dienst liest den Pfad aus WEBCRON_JOBS.
      WEBCRON_JOBS: /tests/takt.cron
    volumes:
      - testdaten:/tests:ro
    # Haertung: nur das Noetige. crond wechselt je Job die Identitaet
    # (SETUID/SETGID), httpd laeuft als "nobody".
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /etc/crontabs:mode=0755
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    depends_on:
      testdaten:
        condition: service_completed_successfully
      ziel:
        condition: service_started

  ziel:
    image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
    command: python /tests/ziel.py
    volumes:
      - testdaten:/tests:ro
    depends_on:
      testdaten:
        condition: service_completed_successfully

volumes:
  testdaten:
